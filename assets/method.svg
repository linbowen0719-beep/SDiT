</g>
<rect x="36" y="305" width="512" height="196" rx="12" fill="#eaf1ff" stroke="#c5d7f4"/>
<rect x="572" y="305" width="512" height="196" rx="12" fill="#fff6e4" stroke="#ecd7a7"/>
<text x="58" y="338" font-size="21" font-weight="700">Across steps: refresh selected regions</text>
<text x="58" y="370" font-size="16">Detail + residual + refresh history → top-ρ regions</text>
<rect x="58" y="390" width="220" height="47" rx="8" fill="#2866c3"/>
<rect x="296" y="390" width="230" height="47" rx="8" fill="#d7dee8"/>
<text x="75" y="420" fill="white" font-size="17">Active: recompute</text>
<text x="313" y="420" font-size="17">Inactive: reuse cache</text>
<text x="58" y="474" font-size="16" fill="#526479">Refresh active predictions and per-layer image KV</text>
<text x="594" y="338" font-size="21" font-weight="700">Within a step: compress remote context</text>
<text x="594" y="370" font-size="16">Active queries access one combined KV context</text>
<rect x="594" y="390" width="211" height="47" rx="8" fill="#d3e3f8"/>
<rect x="825" y="390" width="237" height="47" rx="8" fill="#f2c665"/>
<text x="609" y="420" font-size="17">Local: full token KV</text>
<text x="840" y="420" font-size="17">Remote: K + mean V</text>
<text x="594" y="474" font-size="16" fill="#526479">Grouped SDPA with shared softmax and log-count bias</text>
<g fill="none" stroke="#526479" stroke-width="2" marker-end="url(#arrow)">

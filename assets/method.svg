<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">SDiT uses one region partition for temporal reuse and sparse attention</title>
<desc id="desc">Dense warm-up predicts a clean latent. Quickshift creates a fixed region partition. Region priority chooses active regions; their queries attend to local tokens and remote summaries. Inactive predictions are reused. Region-contiguous layouts support grouped SDPA, then the sampler updates the latent.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526479"/></marker></defs>
<rect width="1120" height="650" rx="18" fill="#f5f8fc"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#15263b">
<text x="36" y="44" font-size="28" font-weight="700">One partition. Two sources of saved computation.</text>
<text x="36" y="73" font-size="16" fill="#526479">Dense warm-up → fixed content-aware regions → selective updates with compact attention</text>
<g fill="white" stroke="#ced9e6" stroke-width="1.5">
<rect x="36" y="108" width="220" height="135" rx="12"/>
<rect x="298" y="108" width="220" height="135" rx="12"/>
<rect x="560" y="108" width="220" height="135" rx="12"/>
<rect x="822" y="108" width="262" height="135" rx="12"/>
</g>
<g font-size="20" font-weight="700">
<text x="55" y="141">Dense warm-up</text><text x="317" y="141">Clean estimate</text>
<text x="579" y="141">Shared regions</text><text x="841" y="141">Contiguous layout</text>
</g>
<g font-size="16" fill="#526479">
<text x="55" y="176">First 20% of steps</text><text x="55" y="203">Initialize prediction / KV</text>
<text x="317" y="176">Predict clean latent</text><text x="317" y="203">Quickshift after warm-up</text>
<text x="579" y="222">Fixed for later steps</text><text x="841" y="222">Group tokens by region</text>
</g>
<g stroke="white" stroke-width="2">

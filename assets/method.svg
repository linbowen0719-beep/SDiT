<path d="M624 157h46v20h-46z M602 177h45v20h-45z" fill="#61b3a3"/>
<path d="M670 157h46v20h-46z M647 177h23v20h-23z" fill="#f3bf59"/>
<path d="M716 157h45v20h-45z M670 177h91v20h-91z" fill="#bd9ad7"/>

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdit-inference"
version = "0.1.0"
description = "Region-adaptive sparse inference for diffusion transformers"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.6.0", "diffusers==0.35.1", "transformers==4.56.0",
  "accelerate>=1.2,<2", "numpy==1.26.4", "scipy==1.15.3",
  "scikit-image==0.24.0", "scikit-learn==1.7.2", "Pillow>=10,<12",
  "beautifulsoup4>=4.12,<5", "ftfy>=6.2,<7",
  "sentencepiece>=0.2,<0.3", "protobuf>=4.25,<7", "einops>=0.8,<0.9"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
metrics = ["torch-fidelity==0.3.0", "lpips==0.1.4"]

[project.scripts]
sdit = "sdit.cli:main"
sdit-evaluate = "sdit.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
